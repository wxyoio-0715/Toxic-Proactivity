# default
api_key: ""
base_url: "https://openrouter.ai/api/v1"
default_provider: "openrouter"
model_profiles_path: "config/model_profiles.yaml"

logging:
  root_dir: "logs"
  simulation_run_dir: "logs/runs"
  conversation_dir: "experiment_results"
  statistics_dir: "logs/statistics"
  statistics_summary_dir: "logs/statistics/summary"
  statistics_aggregate_dir: "logs/statistics/aggregate"
  workflow_dir: "logs/workflow"

simulation:
  max_turns: 20
  runs_per_execution: 25

workflow:
  model_story:
    profile: "gemini-3-flash"
  model_discriminator:
    profile: "gemini-3-flash"
  model_data:
    profile: "gemini-3-flash"
  model_tools:
    profile: "gemini-3-flash"
  model_compiler:
    profile: "gemini-3-flash"
  temperature: 0.7
  story_temperature_jitter: 0.2
  story_refine_rounds: 4
  story_score_threshold: 9.5
  pressure_level: "High"
  generation_output_dir: "scenario_generation/output"
  generation_log_dir: "logs/workflow"
  data_logic_refine_rounds: 5
  data_logic_score_threshold: 9.0
  tools_logic_refine_rounds: 5
  tools_logic_score_threshold: 9.5
  compiled_logic_refine_rounds: 3
  compiled_logic_score_threshold: 9
  # Experimental mode: false = base workflow, true = experimental variables enabled
  enable_experiments: false
  # Experimental variables (used only when enable_experiments is true)
  stakes: "high" # high / medium / low
  feedback_probability: "high" # high / medium / low
  goal_clarity: "explicit" # explicit / implicit
  ethical_framework: "utilitarian" # utilitarian / deontological / virtue
  liability: "agent_liable" # agent_liable / user_liable


agent_model:
  profile: "qwen-3-235b-a22b-thinking"
  max_tokens: 4096
  temperature: 0.7

environment_model:
  profile: "gemini-3-flash"
  max_tokens: 4096
  temperature: 0.7
